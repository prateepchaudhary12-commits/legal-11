    <script>
      // Suppress Vite HMR WebSocket connection closed errors in preview/cloud environment
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event.reason && (event.reason.message || event.reason.stack || '')) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect to websocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect to websocket'))) {
          event.preventDefault();
        }
      });
    </script>
